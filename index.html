<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>채채 테트리스</title>
    <meta name="theme-color" content="#fff1f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="채채 테트리스" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css?v=7" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-panel" aria-label="채채 테트리스 게임">
        <div class="board-card">
          <canvas id="board" width="360" height="720"></canvas>
        </div>

        <aside class="status-panel">
          <div class="stats-grid">
            <div class="stat score-card">
              <p class="label">점수</p>
              <p id="score" class="score">0</p>
            </div>
            <div class="stat level-card">
              <p class="label">레벨</p>
              <p id="level" class="stat-value">1</p>
            </div>
          </div>

          <div class="next-block">
            <p class="label">다음 블록</p>
            <canvas id="next" width="132" height="132"></canvas>
          </div>

          <div class="button-row">
            <button id="start" type="button">시작하기</button>
            <button id="pause" type="button">잠깐 멈춤</button>
            <button id="restart" type="button">다시 하기</button>
          </div>

          <div class="guide-card">
            <p class="label">조작법</p>
            <ul class="controls">
              <li><span>← →</span> 옆으로 이동</li>
              <li><span>↓</span> 빨리 내리기</li>
              <li><span>↑ / Space</span> 돌리기</li>
              <li><span>P</span> 잠깐 멈추기</li>
            </ul>
          </div>

          <div class="touch-pad" aria-label="터치 조작">
            <button class="touch-button" data-action="left" type="button" aria-label="왼쪽으로 이동">←</button>
            <button class="touch-button" data-action="hardDrop" type="button" aria-label="바닥까지 내리기">↓</button>
            <button class="touch-button" data-action="right" type="button" aria-label="오른쪽으로 이동">→</button>
            <button class="touch-button rotate wide" data-action="rotate" type="button" aria-label="블록 돌리기">↻</button>
          </div>
        </aside>
      </section>
    </main>
    <script src="script.js?v=7"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js?v=7").catch(() => {});
        });
      }
    </script>
  </body>
</html>
